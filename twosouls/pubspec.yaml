name: twosouls
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Photo picking from gallery/camera
  image_picker: ^1.1.2

  # Google AdMob — real ads in production, Google test ads in debug.
  # Replace ad unit IDs in lib/ads/ad_config.dart when you have real ones.
  google_mobile_ads: ^5.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/archerPic.png
